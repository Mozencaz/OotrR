[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "oot-rando"
version = "0.4.0"
description = "Randomizer for the Ocarina of Time remake (RomFS mods for Hookshot / emulator)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["zstandard>=0.23,<1", "evfl>=1.3,<2", "ainb==0.2.17"]

[project.optional-dependencies]
yaml = ["PyYAML>=6"]
build = ["pyinstaller>=6.10"]

[project.scripts]
oot-rando = "oot_rando.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oot_rando = ["logic/world/*.json", "logic/world/*.txt", "logic/world/regions/*.json"]
